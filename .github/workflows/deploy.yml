name: Deploy to GitHub Pages
run-name: "Deploy: ${{ inputs.deployment_name }}"

on:
  workflow_dispatch:
    inputs:
      deployment_name:
        description: "Name for this deployment"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: ""
      NEXT_PUBLIC_BASE_PATH: ""
      NEXT_PUBLIC_SITE_URL: "https://arkana.blog"
      NEXT_PUBLIC_API_URL: "https://arkana.blog"
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
      NEXT_PUBLIC_GOOGLE_REDIRECT_URI: ${{ secrets.NEXT_PUBLIC_GOOGLE_REDIRECT_URI }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List files (debug)
        run: ls -la

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Check pnpm version
        run: pnpm --version

      - name: Check if lockfile exists (debug)
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            echo "Lockfile exists"
            cat pnpm-lock.yaml | head -n 20
          else
            echo "Lockfile does not exist"
            find . -name "pnpm-lock.yaml"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies without frozen lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Pull content from API
        env:
          ADMIN_HMAC_SECRET: ${{ secrets.ADMIN_HMAC_SECRET }}
        run: node scripts/pull-content.js

      - name: Pull writers from API
        env:
          ADMIN_HMAC_SECRET: ${{ secrets.ADMIN_HMAC_SECRET }}
        run: node scripts/pull-writers.js

      - name: Pull reading lists from API
        env:
          ADMIN_HMAC_SECRET: ${{ secrets.ADMIN_HMAC_SECRET }}
        run: node scripts/pull-reading-lists.js

      - name: Pull tags from API
        run: node scripts/pull-tags.js

      - name: Sync images from the VPS
        env:
          VULTR_HOST: ${{ secrets.VULTR_HOST }}
          VULTR_USER: ${{ secrets.VULTR_USER }}
          VULTR_SSH_KEY: ${{ secrets.VULTR_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VULTR_SSH_KEY" > ~/.ssh/vps_images
          chmod 600 ~/.ssh/vps_images
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts_vps
          export RSYNC_RSH="ssh -i $HOME/.ssh/vps_images -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts_vps -o StrictHostKeyChecking=yes"
          bash scripts/sync-images.sh "${VULTR_USER}@${VULTR_HOST}:/opt/images/"

      - name: Pre-calculate content hashes
        run: node scripts/calculate-hashes.js

      - name: Print environment variables (debug)
        run: |
          echo "BASE_PATH: $BASE_PATH"
          echo "NEXT_PUBLIC_BASE_PATH: $NEXT_PUBLIC_BASE_PATH"
          echo "NEXT_PUBLIC_API_URL: $NEXT_PUBLIC_API_URL"
          echo "NEXT_PUBLIC_GOOGLE_CLIENT_ID: $NEXT_PUBLIC_GOOGLE_CLIENT_ID"
          echo "NEXT_PUBLIC_GOOGLE_REDIRECT_URI: $NEXT_PUBLIC_GOOGLE_REDIRECT_URI"

      - name: Build with Next.js
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  clear-cache:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Clear nginx cache
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          key: ${{ secrets.VULTR_SSH_KEY }}
          script: sudo /usr/local/bin/clear-cache.sh