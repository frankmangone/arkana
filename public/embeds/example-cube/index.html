<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Example: three.js embed</title>
    <link rel="stylesheet" href="/embeds/arkana.css" />
    <style>
      body { overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
      canvas:active { cursor: grabbing; }
      .hint { position: absolute; left: 12px; bottom: 10px; pointer-events: none; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <span class="arkana-label hint">Drag to rotate</span>

    <script type="module">
      import * as THREE from "three";

      const css = getComputedStyle(document.documentElement);
      const token = (name) => new THREE.Color(css.getPropertyValue(name).trim());

      const canvas = document.getElementById("scene");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
      camera.position.z = 4.2;

      const group = new THREE.Group();
      scene.add(group);

      const geometry = new THREE.IcosahedronGeometry(1.3, 1);
      group.add(
        new THREE.Mesh(
          geometry,
          new THREE.MeshBasicMaterial({ color: token("--surface-overlay"), transparent: true, opacity: 0.85 })
        )
      );
      group.add(
        new THREE.LineSegments(
          new THREE.WireframeGeometry(geometry),
          new THREE.LineBasicMaterial({ color: token("--primary-700") })
        )
      );
      const points = new THREE.Points(
        geometry,
        new THREE.PointsMaterial({ color: token("--secondary-700"), size: 0.07 })
      );
      group.add(points);

      function resize() {
        const { clientWidth: w, clientHeight: h } = canvas;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
      new ResizeObserver(resize).observe(canvas);
      resize();

      // Drag to rotate; auto-spin unless the reader prefers reduced motion.
      let dragging = false;
      let last = [0, 0];
      const spin = !matchMedia("(prefers-reduced-motion: reduce)").matches;
      canvas.addEventListener("pointerdown", (e) => {
        dragging = true;
        last = [e.clientX, e.clientY];
        canvas.setPointerCapture(e.pointerId);
      });
      canvas.addEventListener("pointerup", () => (dragging = false));
      canvas.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        group.rotation.y += (e.clientX - last[0]) * 0.01;
        group.rotation.x += (e.clientY - last[1]) * 0.01;
        last = [e.clientX, e.clientY];
      });

      renderer.setAnimationLoop(() => {
        if (spin && !dragging) group.rotation.y += 0.004;
        renderer.render(scene, camera);
      });
    </script>
  </body>
</html>
